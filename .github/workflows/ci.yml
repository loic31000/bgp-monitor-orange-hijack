name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint et tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check bgpmon tests
      - name: Ruff (format)
        run: ruff format --check bgpmon tests
      - name: Mypy
        run: mypy bgpmon tests
      - name: Pytest
        run: python -m pytest
      - name: Validation de la configuration d'exemple
        run: python -m bgpmon check-config -c config.example.yaml
