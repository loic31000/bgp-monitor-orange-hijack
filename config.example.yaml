# bgpmon v3 — configuration d'exemple.
#
# Copiez ce fichier en `config.yaml` (ignoré par git) puis adaptez-le :
#   cp config.example.yaml config.yaml
#   python -m bgpmon check-config
#
# Toutes les valeurs ci-dessous sont explicites : ce fichier est la seule
# source de vérité, aucune cible n'est codée en dur dans le programme.
# Les ressources sont désignées uniquement par ASN, préfixe et nom d'organisation.

version: 3

settings:
  check_interval: 300            # secondes entre deux passages RIPEstat/RPKI
  log_level: INFO                # DEBUG | INFO | WARNING | ERROR
  log_format: text               # text | json (une ligne JSON par entrée)
  log_file: bgpmon.log           # null pour désactiver le fichier
  db_path: bgpmon.sqlite3
  recent_window_hours: 24        # durée pendant laquelle un événement ponctuel influe sur l'état
  source_error_cycles: 3         # SOURCE_ERROR après N échecs consécutifs
  visibility_drop_pct: 30        # VISIBILITY_DROP si la visibilité baisse de plus de 30 %
  severity_overrides: {}         # ex. {RPKI_UNKNOWN: info}

  ripestat:
    base_url: https://stat.ripe.net/data
    sourceapp: bgpmon
    timeout: 20
    retries: 3
    backoff: 2.0                 # base du backoff exponentiel (s)
    min_interval: 0.5            # délai minimal entre deux requêtes (s)
    cache_ttl: 60                # cache court des réponses (s)
    asn_prefix_window_hours: 24  # fenêtre d'announced-prefixes
    max_more_specific_queries: 32
    neighbour_types: [left, right]  # « uncertain » fluctue beaucoup d'un jeu de données à l'autre

  ris_live:
    enabled: true
    url: wss://ris-live.ripe.net/v1/ws/?client=bgpmon-orange-investigation
    heartbeat_seconds: 30
    reconnect_max_seconds: 300
    queue_size: 10000

  rpki:
    enabled: true

  irr:
    enabled: true
    interval: 3600               # les objets IRR sont relus toutes les heures
    timeout: 20
    query_delay: 1.0             # pause entre deux requêtes whois (s)
    servers:
      - {name: RADB, host: whois.radb.net, port: 43, query_prefix: "-s RADB"}
      - {name: ALTDB, host: whois.altdb.net, port: 43, query_prefix: ""}
      - {name: RIPE, host: whois.ripe.net, port: 43, query_prefix: "-r"}

  report:
    path: bgp_report.html
    refresh_seconds: null        # null = check_interval
    history_per_target: 20
    timeline_size: 50

  alerts:
    cooldown_seconds:
      default: 3600
      SOURCE_ERROR: 21600
      VISIBILITY_DROP: 1800
    channels:
      - {type: console, min_severity: info}
      - {type: jsonl, path: bgp_alerts.jsonl, min_severity: info}
      # URL lue dans la variable d'environnement, jamais écrite dans ce fichier.
      # format : auto (détection par URL) | discord | slack | ntfy | generic
      - {type: webhook, url_env: BGPMON_WEBHOOK_URL, format: auto, min_severity: high}

targets:
  # ── Enquête principale : ancien 90.98.0.0/15 d'Orange France (AS3215) ────
  # Le /15 a été annoncé via AS41128 de février à avril 2026, puis repris par
  # AS3215 via deux /16 le 20/04/2026. Depuis le transfert RIPE NCC du
  # 03/09/2026, seule la moitié 90.99.0.0/16 reste à Orange : la cible est
  # scindée en deux /16 (voir dossier/90.98.0.0-18/RAPPORT.md).
  #
  # Surveillance : l'apparition d'un objet `route` ou d'une ROA nouveaux sur ces
  # deux préfixes doit déclencher un événement.
  #   - irr: watch → IRR_OBJECT_CREATED / MODIFIED / DELETED (préfixe exact et
  #     plus-spécifiques, sur RADB, ALTDB et RIPE) ;
  #   - ROA → RPKI_STATE_CHANGED (ROA apparue ou disparue, changement de statut)
  #     pour chaque couple (préfixe, origine) observé en BGP sur ces cibles.
  - label: "90.99.0.0/16"
    type: prefix
    resource: "90.99.0.0/16"
    role: "Espace Orange France"
    description: "Moitié du 90.98.0.0/15 d'origine restée à Orange S.A. ; annoncée par AS3215 (ROA maxLength 24)"
    expected_origins: [3215]
    forbidden_origins: [41128, 270118]
    forbidden_path_asns: [41128, 22541, 29802]
    expected_upstreams: []
    max_prefix_length: 24
    allow_more_specific_from: [3215]
    rpki: expect_valid
    irr: watch
    severity: critical

  # Transféré à Fastly le 03/09/2026 (RIPE NCC), à confirmer par les NOC ;
  # passer rpki à expect_valid dès qu'une ROA AS54113 existe.
  - label: "90.98.0.0/16"
    type: prefix
    resource: "90.98.0.0/16"
    role: "Ancien espace Orange, transféré à Fastly, Inc."
    description: "Transfert RIPE NCC Orange S.A. → Fastly, Inc. du 03/09/2026 ; 90.98.0.0/18 annoncé par AS54113 depuis le 05/10/2026"
    expected_origins: [54113]
    forbidden_origins: [41128, 270118]
    forbidden_path_asns: [41128, 22541, 29802]
    expected_upstreams: []
    max_prefix_length: 24
    allow_more_specific_from: [54113]
    rpki: any
    irr: watch
    severity: high

  - label: "92.183.128.0/18"
    type: prefix
    resource: "92.183.128.0/18"
    role: "Espace Orange France (cible secondaire)"
    description: "Pré-positionnement documenté depuis mai 2024"
    expected_origins: [3215]
    forbidden_origins: [263692]
    forbidden_path_asns: [263692, 41128]
    expected_upstreams: []
    max_prefix_length: 24
    allow_more_specific_from: [3215]
    rpki: expect_valid
    irr: watch
    severity: critical

  - label: "AS41128"
    type: asn
    resource: 41128
    role: "Origine de l'annonce frauduleuse"
    description: "ORANGEFR-GRX-AS (Orange S.A.) — ASN peu utilisé détourné"
    watch_prefix_set: true
    watch_neighbours: true
    ris_live_origin: true
    irr: watch
    severity: high

  - label: "AS3215"
    type: asn
    resource: 3215
    role: "Orange France — origine légitime"
    description: "Orange S.A."
    watch_prefix_set: true
    watch_neighbours: false
    ris_live_origin: false
    irr: ignore
    severity: warning

  - label: "AS29802"
    type: asn
